name = "tolaria-tg-bot"
main = "src/index.ts"
compatibility_date = "2026-04-01"

# Cron trigger: запускать Worker каждую минуту.
# scheduled-handler опрашивает Telegram getUpdates и коммитит новые сообщения.
[triggers]
crons = ["* * * * *"]

# KV namespace для хранения last_offset (id Telegram update, обработанного последним).
[[kv_namespaces]]
binding = "OFFSETS"
id = "410edc526233474b9ac2e0db9117ce5d"
